version: 2.1

jobs:
  build_and_test:
    docker:
      - image: cimg/node:22.16.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm ci --ignore-scripts --no-audit --no-fund
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Build and test
          command: npm test

workflows:
  verify:
    jobs:
      - build_and_test
