services:
  ai-control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-control-plane:local
    environment:
      NODE_ENV: production
      PORT: "3000"
      AI_CONTROL_PLANE_HOST: 0.0.0.0
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || '3000') + '/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
